
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Tebak Angka</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <div class="icon">🎯</div>

        <h1>Tebak Angka</h1>
        <p class="subtitle">
            Aku punya angka rahasia antara 1 sampai 100!
        </p>

        <div class="info">
            <div class="info-box">
                <span>Skor</span>
                <strong id="score">100</strong>
            </div>

            <div class="info-box">
                <span>Percobaan</span>
                <strong id="attempts">0</strong>
            </div>
        </div>

        <label for="guessInput">Masukkan tebakanmu</label>

        <input
            type="number"
            id="guessInput"
            min="1"
            max="100"
            placeholder="Contoh: 50"
        >

        <button id="guessButton">Tebak Angka</button>

        <p id="message" aria-live="polite">
            Ayo mulai permainan!
        </p>

        <div class="history">
            <h3>Riwayat Tebakan</h3>
            <ul id="historyList">
                <li>Belum ada tebakan.</li>
            </ul>
        </div>

        <button id="restartButton" class="restart">
            🔄 Main Lagi
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
